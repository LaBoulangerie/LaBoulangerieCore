vault-reset-regions:
  - world:vault_reset_area

rp-radius: 10

rp-cooldown: 15 # in seconds

# Netherite armor slowdown
netherite-slowdown:
  enabled: true
  speed-modifier: -0.1  # -10% de vitesse

# Restrictions des Elytras
elytra-restriction:
  enabled: true                  # Active/désactive toute la feature
  rain-restriction: true         # Empêcher le vol quand il pleut
  command-restriction: true      # Permettre les restrictions par commande

  # Vent fort - configuration par monde
  wind-restriction:
    enabled: true

    # Paramètres par défaut (appliqués aux mondes sans config spécifique)
    default-settings:
      check-interval: 300           # Intervalle en secondes (5 min)
      trigger-probability: 0.15     # 15% de chance à chaque check
      duration-min: 300             # Durée min en secondes (5 min)
      duration-max: 7200            # Durée max en secondes (2h)

    # Configuration par monde (hérite de default-settings, peut surcharger)
    worlds:
      world: {}                     # Utilise default-settings
      world_the_end:                # Surcharge certaines valeurs
        trigger-probability: 0.25   # 25% de chance (plus venteux dans l'End)
        duration-max: 3600          # Max 1h seulement

  messages:
    rain: "<red>Impossible de voler pendant la pluie !"
    command: "<red>Les elytras sont temporairement désactivés dans ce monde."
    rain-start: "<red>La pluie commence ! Vous ne pouvez plus voler."
    wind: "<red>Les vents sont trop forts pour voler !"

# Maximum d'entrées dans l'historique IP par joueur
ip-history-max: 150

# BetonQuest - Configuration End Crystal
betonquest:
  end-crystal:
    portal-y: 58
    search-radius: 1.0
    positions:
      east: {x: 3, z: 0}
      west: {x: -3, z: 0}
      north: {x: 0, z: -3}
      south: {x: 0, z: 3}

# Bouteilles d'XP (lecture et creation)
xp-bottle:
  enabled: true
  lore-prefix: "xp: "  # Prefix a chercher dans le lore

  creation:
    xp-amount: 100           # Points XP requis/stockes
    lapis-required: 1        # Lapis requis
    max-reach: 5             # Distance max pour verifier l'air

# Restriction des fusées pour elytra
firework-boost:
  enabled: true
  required-lore: "Propulseur"  # Lore exact requis pour autoriser le boost
  denied-message: "<red>Cette fusée ne peut pas vous propulser !"